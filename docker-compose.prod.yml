# Production stack for a single Ubuntu host.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres and Redis are NOT published to the host (only `expose`d on the
# internal compose network) — this matters because Docker-published ports
# bypass ufw. Only Caddy publishes 80/443.
#
# Variables read from ./.env (compose substitutes ${...} automatically):
#   DOMAIN             public hostname, e.g. clickup-sync.example.com
#   POSTGRES_PASSWORD  must match the password embedded in DATABASE_URL

services:
  postgres:
    # NOTE (Meetsy Phase 2): swap to `pgvector/pgvector:pg18` when RAG lands —
    # it ships the `vector` extension. Phase 0 does NOT need it; keep stock here.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clickup_sync
      POSTGRES_USER: clickup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickup -d clickup_sync"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # CI publishes this image to GHCR; the deploy pulls it by commit SHA
    # (IMAGE_TAG), falling back to :latest for a manual `docker compose up`.
    # `build: .` is kept so you can still build locally with `up -d --build`.
    image: ghcr.io/rashedulhasansojib/clickup-sync:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Apply migrations, then start. prisma migrate deploy is idempotent.
    command: sh -c "npm run prisma:deploy && npm run start:prod"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Meetsy (sibling app: NestJS API + Next.js web) ──────────────────────────
  # Shares the Postgres + Redis above; not published to the host (Caddy fronts
  # them at meetsy.${DOMAIN}). Build context = monorepo ROOT.
  meetsy-api:
    build:
      context: .
      dockerfile: apps/meetsy-api/Dockerfile
    restart: unless-stopped
    # AZURE_*, AZURE_EMBED_*, ADMIN_API_KEY, SESSION_*, MEETSY_DATABASE_URL (set
    # to the `postgres` service host in .env for prod) come from .env; the vars
    # below pin connection/runtime values to the compose network.
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 3010
      # Same-origin in prod (web + /api both served at meetsy.${DOMAIN} by Caddy),
      # but set explicitly so a credentialed cross-origin call is allowed.
      CORS_ORIGINS: https://meetsy.${DOMAIN:?set DOMAIN in .env}
    expose:
      - "3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No `command:` override — the image ENTRYPOINT runs `prisma migrate deploy`
    # against MEETSY_DATABASE_URL (the meetsy role) for meetsy's OWN schema ONLY;
    # it never migrates `public` (Clicksy's read-models). The meetsy role must be
    # created + granted first (apps/meetsy-api/prisma/grants.sql, applied
    # out-of-band) or the migration's CREATE SCHEMA/TABLE will be denied.

  meetsy-web:
    build:
      context: .
      dockerfile: apps/meetsy-web/Dockerfile
      args:
        # Baked at build time → the web image is domain-specific (rebuild per
        # domain). Caddy serves the API under meetsy.${DOMAIN}/api.
        NEXT_PUBLIC_API_URL: https://meetsy.${DOMAIN:?set DOMAIN in .env}/api
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - meetsy-api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - meetsy-web
      - meetsy-api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
