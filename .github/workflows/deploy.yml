name: Deploy

# Push to main → quality + e2e gates → build & push image to GHCR → blue-green deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys to the same host at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rashedulhasannifty/clickup-sync

jobs:
  # ── 1. Quality gate (infra-free unit specs) ─────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build:web

  # ── 1b. E2E gate (real Postgres + Redis) ────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clickup
          POSTGRES_PASSWORD: clickup
          POSTGRES_DB: clickup_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clickup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://clickup:clickup@localhost:5432/clickup_sync?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run test:e2e

  # ── 2. Build the image and push to GHCR (the artifact) ──────────────────────
  build-and-push:
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Blue-green deploy ────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Sync deploy files to the host. The server keeps its own .env (rendered
      # in the next step) and its own active.conf state once deployed — but we
      # ship active.conf too so the very first deploy has a seed file.
      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.prod.yml,Caddyfile,scripts/deploy.sh"
          target: ${{ secrets.DEPLOY_PATH }}

      # Seed active.conf ONLY if the host doesn't already have one (don't clobber
      # the live color on subsequent deploys).
      - name: Seed active.conf on first deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            if [ ! -f active.conf ]; then
              echo "reverse_proxy app-web-blue:3000" > active.conf
              echo "seeded active.conf -> blue"
            fi
            chmod +x scripts/deploy.sh

      # Render .env on the host from GitHub secrets (atomic: write tmp, then mv).
      # Values arrive via the envs: list so they are masked in logs and never
      # appear as literal text in this YAML.
      - name: Render .env from secrets
        uses: appleboy/ssh-action@v1
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          WEBHOOK_AUTOHEAL_ENABLED: ${{ secrets.WEBHOOK_AUTOHEAL_ENABLED }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DOMAIN,DATABASE_URL,POSTGRES_PASSWORD,REDIS_URL,APP_ENCRYPTION_KEY,ADMIN_API_KEY,ALLOWED_ORIGINS,APP_BASE_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,MAIL_FROM,WEBHOOK_AUTOHEAL_ENABLED
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            umask 077
            cat > .env.tmp <<EOF
            NODE_ENV=production
            DOMAIN=${DOMAIN}
            DATABASE_URL=${DATABASE_URL}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            REDIS_URL=${REDIS_URL}
            APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
            ADMIN_API_KEY=${ADMIN_API_KEY}
            ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            APP_BASE_URL=${APP_BASE_URL}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS=${SMTP_PASS}
            MAIL_FROM=${MAIL_FROM}
            EOF
            # Optional vars are appended only when set. WEBHOOK_AUTOHEAL_ENABLED is
            # a strict z.enum(['true','false']) in env.validation.ts — writing it
            # empty fails validation and crashes both web and worker on boot, so an
            # unset secret must leave the key absent and let the schema default apply.
            if [ -n "${WEBHOOK_AUTOHEAL_ENABLED:-}" ]; then
              echo "WEBHOOK_AUTOHEAL_ENABLED=${WEBHOOK_AUTOHEAL_ENABLED}" >> .env.tmp
            fi
            mv .env.tmp .env

      - name: Blue-green deploy
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            export IMAGE_TAG="$IMAGE_TAG"
            bash scripts/deploy.sh
            docker logout ghcr.io
